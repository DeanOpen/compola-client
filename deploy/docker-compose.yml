# Compola gateway with Docker Compose. Copy .env.example to .env, set COMPOLA_UPSTREAM (and SITE_ADDRESS for HTTPS),
# then:  docker compose -f deploy/docker-compose.yml up -d
name: compola

services:
  gateway:
    image: ghcr.io/deanopen/compola-gateway:${COMPOLA_GATEWAY_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/gateway/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
      COMPOLA_UPSTREAM: ${COMPOLA_UPSTREAM:-http://host.docker.internal:39218}
    ports:
      # One port for everything (admin console, web client, API, WebSocket, /healthz).
      - "${HTTP_PORT:-8080}:8080"
      # With SITE_ADDRESS set to a domain (automatic HTTPS), publish 443 instead of the line above:
      # - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]  # loopback only, see Caddyfile
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
