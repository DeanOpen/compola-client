# Compola Server on Linux, in this release (no Mac needed): the Zalo engine, API, admin console and web client in one
# container (ghcr.io/deanopen/compola-server). One replica: one container holds the Zalo session.
server:
  enabled: true
  image:
    repository: ghcr.io/deanopen/compola-server
    tag: ""        # defaults to the chart appVersion (same version as the gateway)
    pullPolicy: IfNotPresent
  # First admin, created only while there is none: "user:password". Or a Secret with key COMPOLA_ADMIN.
  admin: ""
  existingSecret: ""
  # How people reach Compola (SSO redirects, device sign-in links); default: https://<first ingress host> when the
  # ingress is on.
  publicUrl: ""
  persistence:
    size: 10Gi
    storageClass: ""
  # WebKitGTK shared memory (/dev/shm).
  shmSize: 1Gi
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 3Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Gateway in front of a Compola desktop app acting as host instead (server.enabled=false): its address, reachable from
# the cluster (LAN, VPN/Tailscale, …).
upstream:
  url: ""          # e.g. http://<desktop-host-address>:39218 (only with server.enabled=false)

replicaCount: 2

image:
  repository: ghcr.io/deanopen/compola-gateway
  tag: ""          # defaults to the chart appVersion; keep it equal to the Compola app version on the host
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  annotations:
    # /ws is a long-lived WebSocket and /upload carries files.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: compola.example.com
  tls: []
  #  - secretName: compola-tls
  #    hosts: [compola.example.com]

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
