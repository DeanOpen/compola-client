# The Compola Server host: the Mac running Compola with "Settings › Compola Server" on and LAN access allowed.
# Reachable from the cluster: a LAN IP, a VPN/Tailscale address, or an in-cluster Service in front of a tunnel.
upstream:
  url: ""          # required, e.g. http://192.168.1.20:39218

replicaCount: 2

image:
  repository: ghcr.io/deanopen/compola-gateway
  tag: ""          # defaults to the chart appVersion; keep it equal to the Compola app version on the host
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  annotations:
    # /ws is a long-lived WebSocket and /upload carries files.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: compola.example.com
  tls: []
  #  - secretName: compola-tls
  #    hosts: [compola.example.com]

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 256Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
