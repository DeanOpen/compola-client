[package]
name = "compola-tauri"
version = "0.1.0"
description = "Compola — a native-shell Zalo client (Rust + Tauri port of zalo-swift-re)"
edition = "2024"

[lib]
name = "compola_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream", "http2"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
cookie_store = "0.21"
cookie = "0.18"
url = "2"
http = "1"
base64 = "0.22"
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
regex = "1"
log = "0.4"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
md-5 = "0.10"
memmap2 = "0.9"
libc = "0.2"
dirs = "6"
mime_guess = "2"
chrono = "0.4"
plist = "1"
arboard = "3"
keyring = { version = "3", features = ["apple-native"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
