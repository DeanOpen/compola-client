<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="mood.css">
  <style>
    body { background: var(--c-bg); min-height: 100vh; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 16px 16px 24px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
    header p { margin: 2px 0 0; font-size: 12px; }
    .tools { display: flex; align-items: center; gap: 8px; }
    .toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; cursor: pointer; user-select: none;
      padding: 4px 10px; border-radius: 999px; border: 1px solid var(--c-border); background: var(--c-surface); }
    .toggle input { margin: 0; accent-color: var(--m-2); }
    .toggle.on { border-color: var(--m-2); color: var(--m-2); background: var(--m-2-bg); }
    .icon-btn { padding: 4px 8px; line-height: 1; font-size: 14px; }

    .summary { margin: 14px 0 12px; padding: 12px; border-radius: 12px; background: var(--c-surface); }
    .summary-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; font-size: 12px; }
    .summary-top b { font-size: 13px; }
    .bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--c-border); }
    .bar span { display: block; height: 100%; transition: width .3s ease; }
    .legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .legend div { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .legend .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .legend b { font-size: 16px; font-variant-numeric: tabular-nums; }
    .legend small { color: var(--c-muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .list { display: flex; flex-direction: column; gap: 2px; }
    .row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer; border: 0;
      background: transparent; text-align: left; width: 100%; color: inherit; font: inherit; }
    .row:hover, .row:focus-visible { background: var(--c-surface); outline: none; }
    .row .face { width: 34px; height: 34px; font-size: 19px; }
    .row .main { flex: 1; min-width: 0; }
    .row .name { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .row .name b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .reason { font-size: 12px; color: var(--c-muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; margin-top: 1px; }
    .row .side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 11px; }
    .row .label { font-size: 11px; color: var(--m); font-weight: 600; white-space: nowrap; }
    .empty { text-align: center; padding: 40px 16px; color: var(--c-muted); }
    .empty .big { font-size: 34px; margin-bottom: 6px; }
    @media (max-width: 420px) {
      .wrap { padding: 12px 12px 20px; }
      .row .label { display: none; }
      .legend small { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Cảm xúc khách</h1>
        <p class="muted">Khách đáng lo nhất ở trên cùng. Bấm vào một dòng để mở hội thoại.</p>
      </div>
      <div class="tools">
        <label class="toggle" id="filterWrap"><input type="checkbox" id="filter"> Chỉ khách không hài lòng</label>
        <button class="icon-btn" id="refresh" title="Làm mới" aria-label="Làm mới">↻</button>
      </div>
    </header>

    <section class="summary" aria-label="Hôm nay">
      <div class="summary-top"><b>Hôm nay</b><span class="muted" id="total"></span></div>
      <div class="bar" id="bar"></div>
      <div class="legend" id="legend"></div>
    </section>

    <div class="list" id="list"></div>
    <div class="err" id="err"></div>
  </div>
  <script src="scale.js"></script>
  <script src="board.js"></script>
</body>
</html>
