<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="mood.css">
  <style>
    body { padding: 2px 0 6px; }
    .head { display: flex; align-items: center; gap: 10px; }
    .head .face { width: 38px; height: 38px; font-size: 22px; }
    .head .main { flex: 1; min-width: 0; }
    .title { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .title b { font-size: 14px; color: var(--m); }
    .reason { font-size: 12px; margin-top: 6px; line-height: 1.4; }
    .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-top: 8px; }
    .scale span { height: 5px; border-radius: 3px; background: var(--c-border); }
    .scale span.on { background: var(--m); }
    .spark { display: block; width: 100%; height: 34px; margin-top: 8px; overflow: visible; }
    .spark .base { stroke: var(--c-border); stroke-dasharray: 2 3; }
    .spark .line { fill: none; stroke: var(--c-muted); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
    .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
    .foot button { padding: 3px 10px; font-size: 12px; }
    .empty { display: flex; align-items: center; gap: 10px; }
    .empty .face { width: 32px; height: 32px; font-size: 18px; opacity: .7; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div class="foot">
    <span class="muted small" id="status"></span>
    <button id="rate" type="button">Đánh giá lại</button>
  </div>
  <div class="err" id="err"></div>
  <script src="scale.js"></script>
  <script src="gauge.js"></script>
</body>
</html>
