<!doctype html>
<html lang="vi">
<head>
<link rel="stylesheet" href="style.css">
<style>
  body { padding: 18px 22px 28px; max-width: 1180px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  h1 { font-size: 19px; margin: 0; font-weight: 650; flex: 1; }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--c-surface); border-radius: 10px; padding: 10px 14px; min-width: 0; }
  .stat .k { font-size: 12px; color: var(--c-muted); }
  .stat .v { font-size: 20px; font-weight: 650; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .s { font-size: 11.5px; color: var(--c-muted); }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
  #q { flex: 1 1 220px; min-width: 160px; padding: 6px 10px; }
  .filters { display: flex; flex-wrap: wrap; gap: 4px; }
  .filters button { padding: 3px 10px; border-radius: 999px; font-size: 12px; }
  .filters button.on { background: var(--c-accent); border-color: var(--c-accent); color: var(--c-accent-fg); }
  .filters button .n { opacity: .7; margin-left: 3px; }
  .rows { border: 1px solid var(--c-border); border-radius: 10px; overflow: hidden; }
  .r { display: grid; grid-template-columns: 96px minmax(0, 1.1fr) minmax(0, 2fr) 116px 132px; grid-template-areas: "code cust items total status";
    gap: 12px; align-items: center; padding: 9px 12px; cursor: pointer; }
  .r + .r { border-top: 1px solid var(--c-border); }
  .r:not(.th):hover { background: var(--c-surface); }
  .r.th { cursor: default; background: var(--c-surface); font-size: 12px; color: var(--c-muted); padding-top: 7px; padding-bottom: 7px; }
  .r > * { min-width: 0; }
  .c-code { grid-area: code; } .c-cust { grid-area: cust; } .c-items { grid-area: items; } .c-total { grid-area: total; text-align: right; }
  .c-status { grid-area: status; }
  .line1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line2 { font-size: 11.5px; color: var(--c-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .c-total { font-weight: 600; }
  .r.cancelled .c-total, .r.cancelled .c-items .line1 { color: var(--c-muted); text-decoration: line-through; }
  select.st { width: 100%; border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 500; border-color: transparent; cursor: pointer; }
  .foot { display: flex; justify-content: center; padding: 10px; }
  .csv { border: 1px solid var(--c-border); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; background: var(--c-surface); }
  .csv .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
  .csv .row span { flex: 1; color: var(--c-muted); }
  .csv textarea { width: 100%; height: 160px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; resize: vertical; }
  @media (max-width: 760px) {
    body { padding: 14px 12px 24px; }
    .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .stat { padding: 8px 10px; }
    .stat .v { font-size: 16px; }
    .r { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "cust total" "items status" "code code"; gap: 2px 10px; }
    .r.th { display: none; }
    .rows .r:nth-child(2) { border-top: 0; }
    .c-status { width: 120px; }
    .c-code { display: flex; gap: 6px; }
    .c-code .line1 { font-size: 11.5px; color: var(--c-muted); }
  }
  @media (max-width: 420px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .stat:last-child { grid-column: 1 / 3; }
  }
</style>
</head>
<body>
  <header>
    <h1>Đơn hàng</h1>
    <button id="csvBtn">Chép CSV</button>
  </header>
  <section class="stats">
    <div class="stat"><div class="k">Hôm nay</div><div class="v num" id="today">—</div><div class="s" id="todayN"></div></div>
    <div class="stat"><div class="k">7 ngày qua</div><div class="v num" id="week">—</div><div class="s" id="weekN"></div></div>
    <div class="stat"><div class="k">Đang xử lý</div><div class="v num" id="open">—</div><div class="s">Mới · Đã xác nhận · Đang giao</div></div>
  </section>
  <div id="csv" class="csv hidden">
    <div class="row"><span id="csvMsg"></span><button id="csvClose" class="ghost">Đóng</button></div>
    <textarea id="csvText" readonly spellcheck="false"></textarea>
  </div>
  <div class="bar">
    <input id="q" type="search" placeholder="Tìm tên, số điện thoại, sản phẩm, mã đơn…">
    <div class="filters" id="filters"></div>
  </div>
  <div id="err" class="err hidden"></div>
  <div id="rows" class="rows"></div>
  <div class="foot"><button id="more" class="hidden">Xem thêm</button></div>
  <script src="../lib/format.js"></script>
  <script src="book.js"></script>
</body>
</html>
