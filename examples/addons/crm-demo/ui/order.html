<!doctype html>
<html>
<head><link rel="stylesheet" href="shared.css">
<style> body { padding: 4px 16px 16px; } .row { flex-direction: column; align-items: stretch; } </style>
</head>
<body>
  <div class="row"><span class="label">Sản phẩm</span><input id="product" autofocus></div>
  <div class="row"><span class="label">Số lượng</span><input id="quantity" type="number" value="1" min="1"></div>
  <div class="row"><span class="label">Đơn giá (₫)</span><input id="price" type="number" value="0" min="0"></div>
  <p class="muted" id="total"></p>
  <div class="row" style="flex-direction: row; justify-content: flex-end">
    <span id="err" class="err"></span>
    <button onclick="compola.close()">Huỷ</button>
    <button class="primary" id="save">Lưu đơn</button>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    const total = () => ($('total').textContent = 'Thành tiền: ' + (Number($('quantity').value) * Number($('price').value)).toLocaleString('vi-VN') + ' ₫');
    ['quantity', 'price'].forEach((id) => $(id).addEventListener('input', total));
    total();
    $('save').onclick = async () => {
      try {
        await compola.call('addOrder', { product: $('product').value, quantity: Number($('quantity').value), price: Number($('price').value), name: compola.context.conversationName });
        await compola.toast('Đã lưu đơn hàng');
        compola.close();
      } catch (e) {
        $('err').textContent = e.message;
      }
    };
  </script>
</body>
</html>
