name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: UI + admin console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run build:admin
      - run: npm run build:web --if-present

  rust:
    name: Rust tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: fingerprint-helper/go.mod
          cache-dependency-path: fingerprint-helper/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # The Tauri context embeds ../dist and the server embeds admin-dist at compile time.
      - run: npm run build && npm run build:admin
      - run: cargo test --lib --locked
        working-directory: src-tauri

  cross:
    name: Rust build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Windows and Linux support is being ported (branch port/cross-platform): non-blocking until it lands.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: fingerprint-helper/go.mod
          cache-dependency-path: fingerprint-helper/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: cross-${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libsecret-1-dev patchelf
      - run: npm ci
      - run: npm run build && npm run build:admin
      - run: scripts/build-fingerprint-helper.sh "${{ matrix.target }}"
      - run: cargo test --lib --locked
        working-directory: src-tauri

  deploy:
    name: Gateway image + Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/compola-gateway
      - run: helm template ci deploy/helm/compola-gateway --set upstream.url=http://192.0.2.10:39218 --set ingress.enabled=true > /dev/null
      - uses: docker/setup-buildx-action@v3
      - name: Build gateway image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/gateway/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
