name: Release

# Push a tag like v0.2.0 (or run it by hand with a tag): builds Compola for macOS (universal, ad-hoc signed),
# Windows (x64: NSIS installer + MSI) and Linux (x64: .deb, .rpm, AppImage), then publishes them all with SHA256SUMS
# to one GitHub Release. The gateway image is published by docker.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to (re)build, e.g. v0.2.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-15
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: fingerprint-helper/go.mod
          cache-dependency-path: fingerprint-helper/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libsecret-1-dev patchelf file

      - run: npm ci

      - name: Set the version from the tag
        run: |
          VERSION="${TAG#v}"
          node -e '
            const fs = require("fs");
            const f = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.version = process.argv[1];
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
          ' "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Ad-hoc signing ("-", tauri.conf.json bundle.macOS.signingIdentity): no Apple account needed.
      # Users open it the first time with right-click → Open (or System Settings → Privacy & Security → Open Anyway).
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: scripts/make-app.sh --universal --dmg

      - name: Build (Windows / Linux)
        if: runner.os != 'macOS'
        run: |
          scripts/build-fingerprint-helper.sh "${{ matrix.target }}"
          npx tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"

      - name: Package
        run: |
          OUT="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p dist-release
          case "$RUNNER_OS" in
            macOS)
              cp "$OUT"/dmg/*.dmg "dist-release/Compola-$VERSION-macos-universal.dmg"
              ditto -c -k --keepParent "$OUT/macos/Compola.app" "dist-release/Compola-$VERSION-macos-universal.zip"
              ;;
            Windows)
              cp "$OUT"/nsis/*.exe "dist-release/Compola-$VERSION-windows-x64-setup.exe"
              cp "$OUT"/msi/*.msi "dist-release/Compola-$VERSION-windows-x64.msi"
              ;;
            Linux)
              cp "$OUT"/deb/*.deb "dist-release/Compola-$VERSION-linux-amd64.deb"
              cp "$OUT"/rpm/*.rpm "dist-release/Compola-$VERSION-linux-x86_64.rpm"
              cp "$OUT"/appimage/*.AppImage "dist-release/Compola-$VERSION-linux-x86_64.AppImage"
              ;;
          esac
          ls -l dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: compola-${{ matrix.target }}
          path: dist-release/*
          if-no-files-found: error

  publish:
    name: Publish the GitHub Release
    needs: build
    # Publish whatever built: one platform failing should not hold back the others.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Checksums
        run: |
          ls dist-release/* >/dev/null 2>&1 || { echo "no platform built" >&2; exit 1; }
          (cd dist-release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
          else
            PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
            gh release create "$TAG" dist-release/* --title "Compola $VERSION" --generate-notes \
              ${PREV:+--notes-start-tag "$PREV"}
          fi
