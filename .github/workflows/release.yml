name: Release

# Push a tag like v0.2.0 (or run it by hand with a tag): builds Compola for macOS (universal, ad-hoc signed),
# Windows (x64: NSIS installer + MSI) and Linux (x64: .deb, .rpm, AppImage), then publishes them all with SHA256SUMS
# to one GitHub Release. The gateway image is published by docker.yml, the Linux server image by server-image.yml.
#
# Every push to main also builds all platforms and replaces the rolling `edge` pre-release (version
# <tauri.conf version>-<run number>), so the newest packages of main are always at /releases/tag/edge. The app's
# updater reads releases/latest, which never points at a pre-release, so edge builds are not offered as updates.
#
# Auto-update: every build also produces a signed update bundle (macOS .app.tar.gz, Windows NSIS installer, Linux
# AppImage) and the release gets a latest.json, which the app polls (tauri.conf.json › plugins.updater). Signing needs
# the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets (`npx tauri signer generate`); the
# public half is plugins.updater.pubkey.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths-ignore:
      - '**.md'
      - docs/**
      - deploy/**
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to (re)build, e.g. v0.2.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || 'edge' }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  UPDATER_CONFIG: '{"bundle":{"createUpdaterArtifacts":true}}'

# A newer push to main supersedes an edge build still running; tag builds always finish.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && !inputs.tag }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: fingerprint-helper/go.mod
          cache-dependency-path: fingerprint-helper/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libsecret-1-dev patchelf file

      - run: npm ci

      - name: Set the version from the tag
        run: |
          VERSION="${TAG#v}"
          if [ "$TAG" = edge ]; then
            # MSI accepts only a numeric pre-release (≤ 65535).
            VERSION="$(node -p 'require("./src-tauri/tauri.conf.json").version.split("-")[0]')-${GITHUB_RUN_NUMBER}"
          fi
          node -e '
            const fs = require("fs");
            const f = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.version = process.argv[1];
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
          ' "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # macOS signing. With the Apple secrets (APPLE_CERTIFICATE + notarization credentials, see README › Signing macOS releases) the
      # app and DMG are Developer ID signed, notarized and stapled by scripts/release.sh. Without them: ad-hoc signed
      # ("-", tauri.conf.json bundle.macOS.signingIdentity); users open it the first time with right-click → Open.
      - name: Developer ID certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::notice::No APPLE_CERTIFICATE secret: the macOS build is ad-hoc signed (not notarized)."
            exit 0
          fi
          # Signing without notarization would still be blocked by Gatekeeper: both or neither.
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_ISSUER" ]; then
            if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
              echo "::warning::APPLE_CERTIFICATE is set but no notarization credentials (APPLE_API_KEY + APPLE_API_ISSUER + APPLE_API_KEY_P8, or APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID): the macOS build stays ad-hoc signed."
              exit 0
            fi
          fi
          KEYCHAIN="$RUNNER_TEMP/compola-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -f pkcs12 -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"
          # The Developer ID intermediate, in case the .p12 was exported without it.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            && security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
            echo "::error::APPLE_CERTIFICATE holds no valid 'Developer ID Application' identity"
            exit 1
          fi
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi
          echo "MAC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "MAC_SIGNED=1" >> "$GITHUB_ENV"

      - name: Build (macOS, ad-hoc signed)
        if: runner.os == 'macOS' && env.MAC_SIGNED != '1'
        run: scripts/make-app.sh --universal --dmg --updater

      - name: Build, sign and notarize (macOS, Developer ID)
        if: runner.os == 'macOS' && env.MAC_SIGNED == '1'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Two notarizations (app, DMG) must fit in the job's 6 h: give up on each after 2.5 h.
        run: COMPOLA_VERSION="$VERSION" COMPOLA_NOTARY_TIMEOUT=9000 scripts/release.sh

      - name: Build (Windows / Linux)
        if: runner.os != 'macOS'
        run: |
          scripts/build-fingerprint-helper.sh "${{ matrix.target }}"
          npx tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" --config "$UPDATER_CONFIG"

      - name: Package
        run: |
          OUT="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p dist-release
          case "$RUNNER_OS" in
            macOS)
              MAC="dist-release/Compola-$VERSION-macos-universal"
              if [ "${MAC_SIGNED:-}" = 1 ]; then
                SIGNED=src-tauri/target/dist/Compola-$VERSION
                cp "$SIGNED.dmg" "$MAC.dmg"
                cp "$SIGNED.zip" "$MAC.zip"
                cp "$SIGNED.app.tar.gz" "$MAC.app.tar.gz"
                cp "$SIGNED.app.tar.gz.sig" "$MAC.app.tar.gz.sig"
              else
                cp "$OUT"/dmg/Compola.dmg "$MAC.dmg"
                ditto -c -k --keepParent "$OUT/macos/Compola.app" "$MAC.zip"
                cp "$OUT"/macos/Compola.app.tar.gz "$MAC.app.tar.gz"
                cp "$OUT"/macos/Compola.app.tar.gz.sig "$MAC.app.tar.gz.sig"
              fi
              ;;
            Windows)
              cp "$OUT"/nsis/*.exe "dist-release/Compola-$VERSION-windows-x64-setup.exe"
              cp "$OUT"/nsis/*.exe.sig "dist-release/Compola-$VERSION-windows-x64-setup.exe.sig"
              cp "$OUT"/msi/*.msi "dist-release/Compola-$VERSION-windows-x64.msi"
              ;;
            Linux)
              cp "$OUT"/deb/*.deb "dist-release/Compola-$VERSION-linux-amd64.deb"
              cp "$OUT"/rpm/*.rpm "dist-release/Compola-$VERSION-linux-x86_64.rpm"
              cp "$OUT"/appimage/*.AppImage "dist-release/Compola-$VERSION-linux-x86_64.AppImage"
              cp "$OUT"/appimage/*.AppImage.sig "dist-release/Compola-$VERSION-linux-x86_64.AppImage.sig"
              ;;
          esac
          ls -l dist-release

      - uses: actions/upload-artifact@v4
        with:
          name: compola-${{ matrix.target }}
          path: dist-release/*
          if-no-files-found: error

      - name: Remove the signing keychain (macOS)
        if: always() && runner.os == 'macOS' && env.MAC_KEYCHAIN != ''
        run: |
          security delete-keychain "$MAC_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  publish:
    name: Publish the GitHub Release
    needs: build
    # Publish whatever built: one platform failing should not hold back the others.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Checksums
        run: |
          ls dist-release/* >/dev/null 2>&1 || { echo "no platform built" >&2; exit 1; }
          (cd dist-release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Update manifest (latest.json)
        # Not for edge: the updater only follows releases/latest (never a pre-release).
        if: env.TAG != 'edge'
        run: |
          VERSION="${TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          python3 - "$VERSION" "$BASE" <<'PY'
          import json, sys, datetime, pathlib
          version, base = sys.argv[1], sys.argv[2]
          d = pathlib.Path("dist-release")
          def entry(name):
              sig = d / f"{name}.sig"
              return {"signature": sig.read_text().strip(), "url": f"{base}/{name}"} if sig.exists() else None
          mac = entry(f"Compola-{version}-macos-universal.app.tar.gz")
          targets = {
              "darwin-aarch64": mac,
              "darwin-x86_64": mac,
              "windows-x86_64": entry(f"Compola-{version}-windows-x64-setup.exe"),
              "linux-x86_64": entry(f"Compola-{version}-linux-x86_64.AppImage"),
          }
          manifest = {
              "version": version,
              "notes": f"Compola {version}: https://github.com/${{ github.repository }}/releases/tag/v{version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {k: v for k, v in targets.items() if v},
          }
          (d / "latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          if [ "$TAG" = edge ]; then
            # The rolling pre-release of main: replaced (tag moved to this commit) on every push.
            gh release delete edge --cleanup-tag --yes >/dev/null 2>&1 || true
            gh release create edge dist-release/* --prerelease --target "$GITHUB_SHA" \
              --title "Compola edge (main @ ${GITHUB_SHA::7})" \
              --notes "Built automatically from \`main\` at ${GITHUB_SHA}. Not a release: for testing the newest changes. Stable versions are the \`v*\` releases."
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
          else
            PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
            gh release create "$TAG" dist-release/* --title "Compola $VERSION" --generate-notes \
              ${PREV:+--notes-start-tag "$PREV"}
          fi
