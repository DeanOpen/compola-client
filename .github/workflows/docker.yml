name: Gateway image

# Builds deploy/gateway (Caddy + the admin console and web client) for linux/amd64 and linux/arm64 and pushes it to
# ghcr.io/<owner>/compola-gateway: `edge` from main, `X.Y.Z`, `X.Y` and `latest` from tags.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - admin/**
      - src/**
      - deploy/gateway/**
      - package.json
      - package-lock.json
      - vite*.ts
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/compola-gateway
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/gateway/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
