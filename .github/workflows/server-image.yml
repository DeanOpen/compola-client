name: Server image

# Builds deploy/server (the whole Compola Server for Linux: Zalo engine, API, admin console, web client) for
# linux/amd64 and linux/arm64 on native runners and pushes ghcr.io/<owner>/compola-server:
# `edge` from main, `X.Y.Z`, `X.Y` and `latest` from tags.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - src/**
      - src-tauri/**
      - admin/**
      - fingerprint-helper/**
      - scripts/build-fingerprint-helper.sh
      - deploy/server/**
      - package.json
      - package-lock.json
      - vite*.ts
      - .github/workflows/server-image.yml
  pull_request:
    paths:
      - deploy/server/**
      - .github/workflows/server-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/compola-server

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Image name (lowercase)
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/server/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=server-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.runner }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
      - name: Smoke test (the server starts and answers /info)
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name smoke -p 39218:39218 -e COMPOLA_ADMIN=admin:smoke-test-123 "${IMAGE}@${{ steps.build.outputs.digest }}"
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:39218/info && exit 0
            sleep 2
          done
          docker logs smoke
          exit 1
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error

  merge:
    name: Publish multi-arch image
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Image name (lowercase)
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:$(jq -r '.tags[0] | split(":")[-1]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
